# cpplint configuration for bolt-cppml, used by the Lint Code Base workflow.
# The matching formatter settings are in .clang-format.
set noparent

# Keep in step with ColumnLimit in .clang-format.
linelength=120

# Header guards are derived from the path below include/, for example
# include/bolt/bolt.hpp -> BOLT_BOLT_HPP_.
root=include

# The code is C++17 and uses the standard threading and time headers
# (<mutex>, <thread>, <chrono>, <system_error>, ...). cpplint's build/c++11
# check rejects those headers outright, so it cannot be satisfied.
filter=-build/c++11

# Source files carry no per-file copyright line; the licence is in LICENSE.
filter=-legal/copyright

# Non-const reference parameters are allowed. The Google style guide dropped
# this rule in 2020 and current cpplint releases no longer check it.
filter=-runtime/references
