# Windows MSBuild/CMake workflow
name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Set up vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git vcpkg_tool
        .\vcpkg_tool\bootstrap-vcpkg.bat

    - name: Install dependencies via vcpkg (manifest mode)
      run: |
        # In manifest mode, vcpkg reads from vcpkg.json automatically
        # We just need to run vcpkg install without package arguments
        .\vcpkg_tool\vcpkg install --triplet=x64-windows

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_TOOLCHAIN_FILE=..\vcpkg_tool\scripts\buildsystems\vcpkg.cmake `
              -DCMAKE_BUILD_TYPE=${{env.BUILD_CONFIGURATION}} ..

    - name: Build with MSBuild
      working-directory: build
      run: |
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ALL_BUILD.vcxproj

    - name: Run tests
      working-directory: build
      run: |
        $env:PATH = "$PWD\bin;$PWD\${{env.BUILD_CONFIGURATION}};$env:PATH"
        ctest --build-config ${{env.BUILD_CONFIGURATION}} --output-on-failure --timeout 120
      continue-on-error: true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-msbuild-artifacts
        path: |
          build/${{env.BUILD_CONFIGURATION}}/*.exe
          build/${{env.BUILD_CONFIGURATION}}/*.dll
          build/bin/*.dll
        retention-days: 7
