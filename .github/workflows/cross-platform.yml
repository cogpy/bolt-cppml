name: Cross-Platform Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  BUILD_TYPE: Release
  VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching,registries

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - name: "Windows MSVC x64"
            os: windows-latest
            generator: "Visual Studio 17 2022"
            arch: x64
            triplet: x64-windows
            cmake_extra: "-A x64"
            
          # macOS builds
          - name: "macOS Intel x64"
            os: macos-13
            triplet: x64-osx
            cmake_extra: ""
            
          - name: "macOS Apple Silicon ARM64"
            os: macos-14
            triplet: arm64-osx
            cmake_extra: ""
            
          # Linux builds
          - name: "Linux x64 (Ubuntu)"
            os: ubuntu-latest
            triplet: x64-linux
            cmake_extra: ""
            
          - name: "Linux x64 (GCC 9)"
            os: ubuntu-20.04
            triplet: x64-linux
            compiler_version: 9
            cmake_extra: ""

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Clone vcpkg
      shell: bash
      run: |
        mkdir -p ./ssr_deps
        git clone https://github.com/Microsoft/vcpkg.git ./ssr_deps/vcpkg
        cd ./ssr_deps/vcpkg
        git checkout de117c9255ff3d68c1ba730b6c96dc3418c74ae3
      
    - name: Bootstrap vcpkg (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: ./ssr_deps/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      
    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: .\ssr_deps\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        
    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2
        
    - name: Setup specific GCC version (Linux)
      if: matrix.compiler_version && runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-${{ matrix.compiler_version }} g++-${{ matrix.compiler_version }}
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ matrix.compiler_version }} 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ matrix.compiler_version }} 100
        
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libcurl4-openssl-dev \
          libjsoncpp-dev \
          libglfw3-dev \
          libgl1-mesa-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev
          
    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install cmake ninja pkg-config curl jsoncpp glfw
        
    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.workspace }}/vcpkg
          ~/.cache/vcpkg
          ~/Library/Caches/vcpkg
        key: ${{ matrix.triplet }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ matrix.triplet }}-vcpkg-
          
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=./ssr_deps/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          ${{ matrix.cmake_extra }}
      shell: bash
        
    - name: Build project
      run: cmake --build build --config ${{ env.BUILD_TYPE }}
      
    - name: Run tests (Linux/macOS)
      if: runner.os != 'Windows'
      working-directory: build
      run: |
        export LD_LIBRARY_PATH="${PWD}/bin:${PWD}:$LD_LIBRARY_PATH"
        ctest --build-config ${{ env.BUILD_TYPE }} --output-on-failure --timeout 120
      continue-on-error: true
      
    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      working-directory: build
      run: |
        $env:PATH = "$PWD\bin;$PWD\${{ env.BUILD_TYPE }};$env:PATH"
        ctest --build-config ${{ env.BUILD_TYPE }} --output-on-failure --timeout 120
      continue-on-error: true
      
    - name: Create packages
      if: github.event_name == 'release'
      run: |
        cd build
        cpack
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bolt-cpp-${{ matrix.name }}-${{ github.sha }}
        path: |
          build/bolt*
          build/*.exe
          build/*.app
          build/*.deb
          build/*.rpm
          build/*.dmg
          build/*.msi
          build/*.zip
          build/*.tar.gz
          build/bin/*.so*
          build/bin/*.dll
          build/${{ env.BUILD_TYPE }}/*.exe
          build/${{ env.BUILD_TYPE }}/*.dll
        retention-days: 30
        
    - name: Upload packages to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/*.exe
          build/*.dmg
          build/*.deb
          build/*.rpm
          build/*.msi
          build/*.zip
          build/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cross-compile:
    name: Cross-compilation targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: "ARM64 Linux"
            triplet: arm64-linux
            gcc: aarch64-linux-gnu
          - name: "ARM32 Linux"
            triplet: arm-linux
            gcc: arm-linux-gnueabihf
            
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup cross-compilation toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-${{ matrix.target.gcc }} g++-${{ matrix.target.gcc }}
        
    - name: Clone vcpkg for cross-compilation
      run: |
        mkdir -p ./ssr_deps
        git clone https://github.com/Microsoft/vcpkg.git ./ssr_deps/vcpkg
        cd ./ssr_deps/vcpkg
        git checkout de117c9255ff3d68c1ba730b6c96dc3418c74ae3
        ./bootstrap-vcpkg.sh -disableMetrics
        
    - name: Cross-compile
      run: |
        mkdir build-cross
        cd build-cross
        # Cross-compile without vcpkg (vcpkg cross-compilation requires custom triplet files)
        cmake .. -DCMAKE_C_COMPILER=${{ matrix.target.gcc }}-gcc \
                 -DCMAKE_CXX_COMPILER=${{ matrix.target.gcc }}-g++ \
                 -DCMAKE_BUILD_TYPE=Release \
                 -DENABLE_LLAMA_CPP=OFF
        make -j$(nproc) || true
        
  documentation:
    name: Build documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install documentation tools
      run: |
        pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin
        
    - name: Build documentation
      run: |
        if [ -f mkdocs.yml ]; then
          mkdocs build
        else
          echo "No mkdocs.yml found, skipping documentation build"
        fi
        
    - name: Deploy documentation
      if: github.ref == 'refs/heads/main' && hashFiles('mkdocs.yml') != ''
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
