name: Aptitude/APT Repository Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apt-package:
    # One package per supported Ubuntu release, each built on that release so
    # its dependencies match.
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: ['22.04', '24.04']
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config git dpkg-dev \
            libssl-dev libcurl4-openssl-dev libglfw3-dev \
            libgl1-mesa-dev libglu1-mesa-dev zlib1g-dev libjsoncpp-dev

      - name: Build project
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=ON
          cmake --build build -j "$(nproc)"

      - name: Determine version
        id: version
        # A tag v1.2.3 gives 1.2.3. Any other run gives the project version
        # plus the commit, for example 1.2.3+git0a1b2c3.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE="$(sed -n 's/^project(bolt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
            VERSION="${BASE}+git$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "deb=bolt-cppml_${VERSION}_ubuntu${{ matrix.ubuntu_version }}_amd64.deb" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        run: scripts/build-deb.sh build "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.deb }}"

      - name: Install the package and run bolt from it
        run: |
          sudo apt-get install -y "./${{ steps.version.outputs.deb }}"
          /usr/bin/bolt --version
          printf 'hello\n/exit\n' | /usr/bin/bolt | grep -q 'Echo: hello'
          sudo apt-get remove -y bolt-cppml

      - name: Create APT repository
        # A flat repository for this Ubuntu release. It is unsigned; sign it
        # before publishing it anywhere apt will fetch it from.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEB="${{ steps.version.outputs.deb }}"
          SUITE="ubuntu-${{ matrix.ubuntu_version }}"

          mkdir -p "apt-repo/dists/$SUITE/main/binary-amd64" apt-repo/pool/main
          cp "$DEB" apt-repo/pool/main/

          (
            cd apt-repo
            dpkg-scanpackages pool/main /dev/null > "dists/$SUITE/main/binary-amd64/Packages"
            gzip -9c "dists/$SUITE/main/binary-amd64/Packages" > "dists/$SUITE/main/binary-amd64/Packages.gz"

            {
              echo "Origin: Bolt C++"
              echo "Label: Bolt C++ Repository"
              echo "Suite: $SUITE"
              echo "Codename: $SUITE"
              echo "Version: $VERSION"
              echo "Architectures: amd64"
              echo "Components: main"
              echo "Description: Bolt C++ IDE packages for Ubuntu ${{ matrix.ubuntu_version }}"
              echo "Date: $(date -R)"
            } > "dists/$SUITE/Release"
          )

          grep -q '^Package: bolt-cppml$' "apt-repo/dists/$SUITE/main/binary-amd64/Packages"
          tar -czf "bolt-cppml-apt-repo-${SUITE}.tar.gz" apt-repo

      - name: Upload APT repository
        uses: actions/upload-artifact@v4
        with:
          name: apt-repo-ubuntu-${{ matrix.ubuntu_version }}
          path: 'apt-repo/**'

      - name: Attach repository archive to the release
        # The .deb itself is attached by the Debian Package Build workflow.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 'bolt-cppml-apt-repo-*.tar.gz'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
